<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Introductory course on Bayesian Statistics for PhD students [in French]</title>

  <style>
    :root{
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(15, 23, 42, 0.10);
      --shadow: 0 18px 60px rgba(2, 6, 23, 0.12);
      --shadow-soft: 0 10px 28px rgba(2, 6, 23, 0.08);

      --accent: #2563eb;
      --accent-2: #0ea5e9;

      --radius: 18px;
      --radius-sm: 14px;
      --max: 1040px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html{
      scroll-behavior: smooth;
      min-height: 100%;
    }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
      color: var(--text);

      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(37, 99, 235, 0.12), transparent 60%),
        radial-gradient(1200px 600px at 80% 0%, rgba(14, 165, 233, 0.08), transparent 55%),
        url("../Background_website2.svg"),
        var(--bg);

      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      background-attachment: fixed;

      min-height: 100vh;
      display: flex;
      flex-direction: column;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a{
      color: var(--accent);
      text-decoration: none;
    }

    a:hover{
      text-decoration: underline;
    }

    a:focus-visible{
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 3px;
      border-radius: 10px;
    }

    /* Layout */
    .container{
      max-width: var(--max);
      margin: 60px auto 60px;
      padding: 0 14px;
      flex: 1;
      width: 100%;
    }

    section{
      margin-top: 18px;
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
    }

    h2{
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      line-height: 1.25;
      margin-bottom: 20px;
      color: var(--text);
    }

    .section-rule{
      display: inline-block;
      flex: 0 0 auto;
      height: 10px;
      width: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.10);
    }

    .muted{
      color: var(--muted);
    }

    /* CV items */
    .item{
      margin-top: 12px;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #fbfcfe;
      box-shadow: 0 10px 18px rgba(2, 6, 23, 0.05);
    }

    .item strong{
      color: #0b1220;
      font-weight: 750;
    }

    .item strong a{
      color: #0b1220;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .item strong a:hover{
      color: var(--accent);
      text-decoration: none;
    }

    .item em{
      color: var(--muted);
    }

    .item p{
      margin-top: 8px;
    }

    iframe{
      width: 100%;
      height: 800px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: #ffffff;
    }

    .links{
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(37, 99, 235, 0.16);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(37, 99, 235, 0.22);
      text-decoration: none;
    }

    @media (max-width: 700px){
      .container{
        margin: 30px auto 40px;
        padding: 0 12px;
      }

      section{
        padding: 20px;
      }

      iframe{
        height: 650px;
      }

      .btn{
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section id="pdf_bayesian_for_phd_students">
      <h2>
        <span class="section-rule" aria-hidden="true"></span>
        Introductory course on Bayesian Statistics [in French]
      </h2>

      <div class="item">
        <iframe
          src="Intro_Stats_Bay%C3%A9siennes_PDF_2026.pdf"
          title="Introductory course on Bayesian Statistics PDF">
          Your browser does not support embedded PDFs.
        </iframe>

        <div class="links">
          <a
            class="btn"
            href="https://github.com/RomaindiStasi/page/blob/main/Courses/Script_Bayesian_2026.Rmd"
            target="_blank"
            rel="noopener noreferrer">
            Open R script
          </a>

          <a
            class="btn"
            href="https://romaindistasi.github.io/page">
            Back to the Website
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
